# Builds an installable mod zip without the game or Godot:
# compiles against reference-assembly stubs and packs the .pck with BSchneppe.StS2.PckPacker (see RunePriest.csproj).
#   - pull requests: Nightly variant build + short-lived artifact for testers
#   - push to main:  Nightly variant -> rolling "nightly" pre-release + friends-only nightly Workshop item
#   - tag v*:        Release variant -> versioned release + release Workshop item
# Variants are separate mods (RunePriestNightly / RunePriest) so they can be installed side by side; see docs/build-variants.md.
# Workshop uploads are skipped until the WORKSHOP_NIGHTLY_ID / WORKSHOP_RELEASE_ID repo variables are set.
name: Build mod

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', '.gitignore', '.gitattributes']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.gitignore', '.gitattributes']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Lets the net9.0 PCK packer tool run on a newer runtime if that's what the runner has.
  DOTNET_ROLL_FORWARD: Major
  MOD_VARIANT: ${{ startsWith(github.ref, 'refs/tags/v') && 'Release' || 'Nightly' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('*.csproj', 'Sts2PathDiscovery.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: jq --arg v "$GITHUB_REF_NAME" '.version = $v' RunePriest.json > tmp.json && mv tmp.json RunePriest.json

      - name: Build
        run: dotnet build RunePriest.csproj -c Release -p:UseSts2RefAssemblies=true -p:ModVariant=$MOD_VARIANT

      # The build assembles bin/Release/package/<ModId>/ (dll, pck, manifest).
      - name: Package
        run: |
          mkdir -p dist
          cp -r .godot/mono/temp/bin/Release/package/. dist/
          mod_id=$(ls dist)
          echo "MOD_ZIP=$mod_id.zip" >> "$GITHUB_ENV"
          (cd dist && zip -qr "../$mod_id.zip" "$mod_id")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: dist/
          retention-days: 7

      - name: Publish nightly pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly "$MOD_ZIP" --prerelease --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes "Automatic build of \`main\` at ${GITHUB_SHA::7}. May be unstable. See the README for install steps."

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$MOD_ZIP" --title "RunePriest $GITHUB_REF_NAME" --generate-notes

  workshop:
    needs: build
    # Item IDs must be repository variables (environment variables aren't visible to job-level `if`).
    if: >-
      github.event_name != 'pull_request' && (
        (github.ref == 'refs/heads/main' && vars.WORKSHOP_NIGHTLY_ID != '') ||
        (startsWith(github.ref, 'refs/tags/v') && vars.WORKSHOP_RELEASE_ID != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the Steam secrets; restrict its deployment branches to main and v* tags.
    environment: steam-workshop
    permissions:
      contents: read
    env:
      ITEM_ID: ${{ startsWith(github.ref, 'refs/tags/v') && vars.WORKSHOP_RELEASE_ID || vars.WORKSHOP_NIGHTLY_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: RunePriest/mod_image.png
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: mod
          path: dist

      # Official Valve tarball rather than a third-party action, since this job holds account credentials.
      - name: Install SteamCMD
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1
          mkdir -p ~/steamcmd
          curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C ~/steamcmd
          # First run self-updates and can exit non-zero.
          ~/steamcmd/steamcmd.sh +quit || true

      - name: Upload to Steam Workshop
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          for d in ~/steamcmd/config ~/Steam/config; do
            mkdir -p "$d"
            printf '%s' "$STEAM_CONFIG_VDF" | base64 -d > "$d/config.vdf"
          done

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            note="$GITHUB_REF_NAME - https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
            visibility=''
          else
            note="Nightly ${GITHUB_SHA::7}: $(printf '%s' "$COMMIT_MSG" | head -n1 | tr -d '"\\')"
            visibility='"visibility" "1"'
          fi

          cat > workshop.vdf <<EOF
          "workshopitem"
          {
            "appid" "2868840"
            "publishedfileid" "$ITEM_ID"
            "contentfolder" "$PWD/dist"
            "previewfile" "$PWD/RunePriest/mod_image.png"
            "changenote" "$note"
            $visibility
          }
          EOF

          timeout 10m ~/steamcmd/steamcmd.sh +@ShutdownOnFailedCommand 1 +@NoPromptForPassword 1 \
            +login "$STEAM_USERNAME" +workshop_build_item "$PWD/workshop.vdf" +quit

      - name: Remove Steam credentials
        if: always()
        run: rm -f ~/steamcmd/config/config.vdf ~/Steam/config/config.vdf
